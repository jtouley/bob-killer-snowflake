[project]
name = "bob-killer"
version = "0.0.1"
description = "Compile an Excel workbook into a Streamlit app, docs and an equivalence test suite from one Workbook IR."
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic~=2.11",
  "fastapi~=0.115",
  "python-multipart>=0.0.20",
  "openpyxl>=3.1",
  "jinja2~=3.1",
  "pyyaml>=6",
  "oletools>=0.60",
]

[project.optional-dependencies]
snowflake = [
  "snowflake-snowpark-python>=1.30",
  "openpyxl>=3.1",
  "pyyaml>=6",
]

[project.scripts]
bob-killer = "bob_killer.cli:main"

[dependency-groups]
dev = [
  "snowflake-snowpark-python>=1.30",
  "openpyxl>=3.1",
  "types-openpyxl",
  "pyyaml>=6",
  "types-PyYAML",
  "types-olefile",
  "jsonschema>=4.23",
  "types-jsonschema",
  "streamlit>=1.50",
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "mypy>=1.13",
  "ruff>=0.8",
  "import-linter>=2.1",
  "mutmut>=3",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bob_killer", "src/bob_killer_sis"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
  "bob_killer",
  "bk_gates",
  "export_contracts",
  "fetch_golden",
  "gates",
  "hook_post_edit",
  "hook_stop",
  "hooks_log_head",
  "record_run",
  "tests",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "SIM300"]  # inline cheat sources; never auto-rewrite asserts

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["src", "scripts"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# oletools ships no py.typed marker and has no typeshed stubs (olefile does: types-olefile).
module = ["oletools", "oletools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers -m 'not live'"
markers = [
  "live: needs the bob_killer Snowflake connection; run with `uv run pytest -m live tests/live`",
]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "."]

[tool.coverage.run]
source = ["src/bob_killer", "src/bob_killer_sis"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.importlinter]
root_packages = ["bob_killer", "bob_killer_sis"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api/cli > service > stages > store > ir/registry/runtime > contracts"
type = "layers"
layers = [
  "bob_killer.api | bob_killer.cli | bob_killer.hosts",
  "bob_killer.service",
  "bob_killer.extract | bob_killer.graph | bob_killer.lift | bob_killer.generate | bob_killer.verify",
  "bob_killer.store",
  "bob_killer.registry",
  "bob_killer.ir | bob_killer.runtime",
  "bob_killer.contracts",
]

[[tool.importlinter.contracts]]
name = "Production code never imports tests"
type = "forbidden"
source_modules = ["bob_killer"]
forbidden_modules = ["tests"]

[[tool.importlinter.contracts]]
name = "The Snowflake host never imports the FastAPI surface"
type = "forbidden"
source_modules = ["bob_killer.hosts.snowflake"]
forbidden_modules = ["bob_killer.api", "fastapi", "uvicorn"]

[[tool.importlinter.contracts]]
name = "Generators read registry.functions; they never evaluate Excel semantics"
type = "forbidden"
source_modules = ["bob_killer.generate"]
forbidden_modules = ["bob_killer.runtime"]

[[tool.importlinter.contracts]]
name = "The Streamlit app (Python 3.11) never imports the core"
type = "forbidden"
source_modules = ["bob_killer_sis"]
forbidden_modules = ["bob_killer"]

[tool.mutmut]
paths_to_mutate = [
  "src/bob_killer/runtime/",
  "src/bob_killer/service/",
  "src/bob_killer/store/",
  "src/bob_killer/hosts/snowflake/",
  "src/bob_killer/verify/",
]
pytest_add_cli_args_test_selection = ["tests/unit"]
