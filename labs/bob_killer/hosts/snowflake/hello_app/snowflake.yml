definition_version: 2
# Hello probe (docs/SPEC.md §4 F1, F7). Two copies of one app: with and without the PyPI
# integration. Deployed only into a TEST_<uuid8> schema by tests/live/test_platform.py.
mixins:
  hello_shared:
    query_warehouse: BOB_KILLER_WH
    compute_pool: BOB_KILLER_POOL
    runtime_name: SYSTEM$ST_CONTAINER_RUNTIME_PY3_11
    main_file: streamlit_app.py
    artifacts:
      - streamlit_app.py
      - pyproject.toml
entities:
  hello_eai:
    type: streamlit
    identifier:
      name: HELLO_EAI
    external_access_integrations:
      - BOB_KILLER_PYPI_EAI
    meta:
      use_mixins:
        - hello_shared
  hello_no_eai:
    type: streamlit
    identifier:
      name: HELLO_NO_EAI
    meta:
      use_mixins:
        - hello_shared
