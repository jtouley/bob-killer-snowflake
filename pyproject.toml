[project]
name = "bob-killer"
version = "0.0.1"
description = "Compile an Excel workbook into a Streamlit app, docs and an equivalence test suite from one Workbook IR."
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic~=2.11",
  "fastapi~=0.115",
  "python-multipart>=0.0.20",
]

[project.scripts]
bob-killer = "bob_killer.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "mypy>=1.13",
  "ruff>=0.8",
  "import-linter>=2.1",
  "mutmut>=3",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bob_killer"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "SIM300"]  # inline cheat sources; never auto-rewrite asserts

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["src", "scripts"]
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "scripts", "."]

[tool.coverage.run]
source = ["src/bob_killer"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.importlinter]
root_packages = ["bob_killer"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api/cli > stages > store > ir/registry/runtime > contracts"
type = "layers"
layers = [
  "bob_killer.api | bob_killer.cli",
  "bob_killer.extract | bob_killer.graph | bob_killer.lift | bob_killer.generate | bob_killer.verify",
  "bob_killer.store",
  "bob_killer.ir | bob_killer.registry | bob_killer.runtime",
  "bob_killer.contracts",
]

[[tool.importlinter.contracts]]
name = "Production code never imports tests"
type = "forbidden"
source_modules = ["bob_killer"]
forbidden_modules = ["tests"]
